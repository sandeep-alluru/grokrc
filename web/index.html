<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0d10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="/manifest.webmanifest">
<title>grokrc</title>
<style>
  :root {
    --bg: #0b0d10; --panel: #14181d; --panel-2: #1b2027; --line: #262d36;
    --fg: #e6eaf0; --dim: #8b96a5; --accent: #6ea8fe;
    --ok: #3fb950; --warn: #d29922; --err: #f85149;
    --safe-b: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--fg);
    font: 15px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column; overscroll-behavior-y: none;
  }
  button { font: inherit; cursor: pointer; }
  code, pre { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; }

  header {
    display: flex; align-items: center; gap: 10px;
    padding: calc(env(safe-area-inset-top, 0px) + 10px) 14px 10px;
    background: var(--panel); border-bottom: 1px solid var(--line);
    position: sticky; top: 0; z-index: 10;
  }
  header .title { font-weight: 600; flex: 1; min-width: 0;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  header button {
    background: var(--panel-2); color: var(--fg); border: 1px solid var(--line);
    border-radius: 8px; padding: 6px 10px; font-size: 13px;
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--dim); flex: none; }
  .dot.live { background: var(--ok); }
  .dot.wait { background: var(--warn); }
  .dot.err  { background: var(--err); }

  main { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 12px; }
  .view { display: none; } .view.on { display: block; }

  /* pairing */
  .center { max-width: 380px; margin: 12vh auto; text-align: center; padding: 0 16px; }
  .center h1 { font-size: 22px; margin: 0 0 6px; }
  .center p { color: var(--dim); margin: 0 0 22px; font-size: 14px; }
  input[type=text] {
    width: 100%; padding: 14px; font-size: 22px; text-align: center;
    letter-spacing: .3em; text-transform: uppercase;
    background: var(--panel); color: var(--fg);
    border: 1px solid var(--line); border-radius: 12px; outline: none;
  }
  input[type=text]:focus { border-color: var(--accent); }
  .btn-primary {
    width: 100%; margin-top: 12px; padding: 14px; border: 0; border-radius: 12px;
    background: var(--accent); color: #06121f; font-weight: 650;
  }
  .btn-primary:disabled { opacity: .5; }
  .err-msg { color: var(--err); font-size: 13px; margin-top: 10px; min-height: 18px; }

  /* session list */
  .session, .notice {
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
    padding: 12px 14px; margin-bottom: 10px; display: flex; gap: 12px; align-items: center;
  }
  /* Looks like a row, but is NOT a session — `.session` must only ever mean a
     real session, or selectors (and taps) land on the wrong thing. */
  .notice { border-style: dashed; }
  .notice:active { background: var(--panel-2); }
  .notice .meta { flex: 1; min-width: 0; }
  .notice .name { font-weight: 600; }
  .notice .sub { color: var(--dim); font-size: 12px; }
  .session:active { background: var(--panel-2); }
  .session .meta { flex: 1; min-width: 0; }
  .session .name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .session .sub { color: var(--dim); font-size: 12px; overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap; }
  .badge {
    background: var(--warn); color: #1a1200; border-radius: 999px;
    padding: 2px 9px; font-size: 12px; font-weight: 700; flex: none;
  }
  .tag { font-size: 11px; color: var(--dim); border: 1px solid var(--line);
    border-radius: 999px; padding: 1px 7px; }

  /* transcript */
  .msg { margin-bottom: 14px; }
  .msg.user { text-align: right; }
  .msg.user .bubble {
    display: inline-block; background: var(--accent); color: #06121f;
    padding: 9px 13px; border-radius: 14px 14px 4px 14px; max-width: 85%;
    text-align: left; white-space: pre-wrap; word-wrap: break-word;
  }
  .msg.agent .bubble { white-space: pre-wrap; word-wrap: break-word; }
  /* Reasoning can run to thousands of words and would otherwise push the actual
     answer off-screen. Cap it and let it scroll in place. `pre-wrap` matters:
     without it the streamed text collapses oddly on reflow. */
  .thinking {
    color: var(--dim); font-style: italic; font-size: 13px;
    border-left: 2px solid var(--line); padding-left: 10px; margin-bottom: 12px;
    white-space: pre-wrap; word-wrap: break-word;
    max-height: 9.5em; overflow-y: auto;
  }

  .tool {
    background: var(--panel); border: 1px solid var(--line); border-left-width: 3px;
    border-radius: 10px; padding: 9px 12px; margin-bottom: 10px; font-size: 13px;
  }
  .tool.running { border-left-color: var(--accent); }
  .tool.ok      { border-left-color: var(--ok); }
  .tool.error   { border-left-color: var(--err); }
  .tool .hd { display: flex; gap: 8px; align-items: center; }
  .tool .nm { font-weight: 600; }
  .tool .st { color: var(--dim); font-size: 11px; margin-left: auto; }
  .tool pre { margin: 8px 0 0; padding: 8px; background: var(--bg);
    border-radius: 6px; overflow-x: auto; max-height: 260px; }

  .plan { background: var(--panel); border: 1px solid var(--line);
    border-radius: 10px; padding: 10px 12px; margin-bottom: 10px; }
  .plan li { list-style: none; font-size: 13px; padding: 2px 0; }
  .plan ul { margin: 0; padding: 0; }
  .plan .done { color: var(--dim); text-decoration: line-through; }

  /* approvals — the point of the whole app */
  .approval {
    background: linear-gradient(180deg, #2a2313, var(--panel));
    border: 1px solid var(--warn); border-radius: 14px;
    padding: 14px; margin-bottom: 12px;
  }
  .approval h3 { margin: 0 0 4px; font-size: 15px; }
  .approval .why { color: var(--dim); font-size: 13px; margin-bottom: 10px; }
  .approval pre { background: var(--bg); border-radius: 8px; padding: 9px;
    overflow-x: auto; max-height: 200px; margin: 0 0 12px; }
  .approval .row { display: flex; gap: 8px; flex-wrap: wrap; }
  .approval button {
    flex: 1 1 auto; min-width: 120px; min-height: 46px; border: 0; border-radius: 10px;
    font-weight: 650; background: var(--panel-2); color: var(--fg);
  }
  .approval button.allow { background: var(--ok); color: #03210a; }
  .approval button.deny  { background: var(--err); color: #2b0505; }
  /* "Allow always" grants for the whole session — deliberately not a green
     button you tap by reflex. Outlined, muted, and never first. */
  .approval button.allow.broad {
    background: transparent; color: var(--dim);
    border: 1px solid var(--line); font-weight: 500;
    flex: 1 1 100%; min-height: 40px; order: 9;
  }
  .approval.resolved { opacity: .55; border-color: var(--line); }

  /* Sticky so it stays reachable in a long transcript — a resume affordance you
     have to scroll to find is one you won't find. */
  .resume-bar {
    position: sticky; top: 0; z-index: 5;
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
    padding: 12px; margin-bottom: 14px;
  }
  .resume-bar .btn-primary { margin-top: 8px; }

  /* Armed state for a destructive action — stopping a process you cannot see. */
  .btn-primary.danger { background: var(--err); color: #fff; }

  /* Hand-back is a rare, deliberate action; it must not compete with Send. */
  .btn-ghost {
    width: 100%; margin-top: 4px; padding: 10px; border-radius: 10px;
    border: 1px solid var(--line); background: transparent;
    color: var(--dim); font-weight: 600; font-size: 13px;
  }
  .btn-ghost:disabled { opacity: .5; }

  .err-line { color: var(--err); font-size: 13px; margin-bottom: 10px; }
  .empty { color: var(--dim); text-align: center; padding: 40px 20px; font-size: 14px; }

  /* composer */
  footer {
    border-top: 1px solid var(--line); background: var(--panel);
    padding: 10px 12px calc(10px + var(--safe-b)); display: flex; gap: 8px;
  }
  /* An author `display` rule beats the UA stylesheet's [hidden]{display:none},
     so setting .hidden on the composer had NO visual effect — read-only
     observed sessions still showed a working-looking input. Must be explicit. */
  footer[hidden] { display: none; }
  footer textarea {
    flex: 1; resize: none; max-height: 120px; padding: 10px 12px;
    background: var(--panel-2); color: var(--fg);
    border: 1px solid var(--line); border-radius: 10px; outline: none;
    font: inherit; line-height: 1.4;
  }
  footer textarea:focus { border-color: var(--accent); }
  footer button {
    border: 0; border-radius: 10px; padding: 0 16px; min-height: 42px;
    background: var(--accent); color: #06121f; font-weight: 650;
  }
  footer button:disabled { opacity: .45; }
  footer button.stop { background: var(--err); color: #2b0505; }
</style>
</head>
<body>

<header>
  <span class="dot" id="conn"></span>
  <span class="title" id="title">grokrc</span>
  <button id="back" hidden>Sessions</button>
</header>

<main>
  <section class="view on" id="v-pair">
    <div class="center">
      <h1>Pair this device</h1>
      <p>Run <code>grokrc up</code> on your machine and enter the code it prints.</p>
      <input type="text" id="code" maxlength="6" inputmode="latin" autocomplete="one-time-code"
             autocapitalize="characters" placeholder="······">
      <button class="btn-primary" id="pair-go">Pair</button>
      <div class="err-msg" id="pair-err"></div>
    </div>
  </section>

  <section class="view" id="v-list"></section>

  <section class="view" id="v-session"></section>
</main>

<footer id="composer" hidden>
  <textarea id="input" rows="1" placeholder="Message Grok…"></textarea>
  <button id="send">Send</button>
</footer>

<script type="module" src="/app.js"></script>
</body>
</html>
